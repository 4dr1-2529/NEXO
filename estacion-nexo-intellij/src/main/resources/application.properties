spring.application.name=estacion-nexo
spring.profiles.default=demostracion
spring.config.import=optional:file:./config/nexo-local.properties

server.port=8080
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${NEXO_SECURE_COOKIE:false}
server.servlet.session.timeout=30m

nexo.db.port=${NEXO_DB_PORT:3306}
nexo.db.schema=${NEXO_DB_SCHEMA:estacion_nexo_demostracion}
nexo.db.create=${NEXO_DB_CREATE:false}
spring.datasource.url=jdbc:mysql://127.0.0.1:${nexo.db.port}/${nexo.db.schema}?createDatabaseIfNotExist=${nexo.db.create}
spring.datasource.username=${NEXO_DB_USER:nexo}
spring.datasource.password=${NEXO_DB_PASSWORD:}
spring.flyway.clean-disabled=true
spring.mvc.problemdetails.enabled=true
