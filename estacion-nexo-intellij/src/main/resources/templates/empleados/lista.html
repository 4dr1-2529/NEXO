<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{publico/base :: cabecera('Empleados')}"></head>
<body>
<header th:replace="~{navegacion :: menu}"></header>
<main class="resumen">
    <h1>Empleados</h1>
    <a class="boton" th:href="@{/empleados/nuevo}">Registrar empleado</a>
    <p role="status" th:if="${mensaje}" th:text="${mensaje}"></p>
    <p class="error" role="alert" th:if="${error}" th:text="${error}"></p>
    <p th:if="${registros.isEmpty()}">No hay registros.</p>
    <div class="tabla" th:unless="${registros.isEmpty()}">
        <table>
            <thead><tr><th>ID</th><th>DNI</th><th>Nombres</th><th>Apellidos</th><th>Cargo</th><th>Teléfono</th><th>Estado</th><th>Acciones</th></tr></thead>
            <tbody><tr th:each="r : ${registros}">
                <td th:text="${r.id}"></td>
                <td th:text="${r.datos.dni}"></td>
                <td th:text="${r.datos.nombres}"></td>
                <td th:text="${r.datos.apellidos}"></td>
                <td th:text="${r.datos.cargo}"></td>
                <td th:text="${r.datos.telefono}"></td>
                <td th:text="${r.activo ? 'Activo' : 'Inactivo'}"></td>
                <td>
                    <a th:href="@{/empleados/{id}/editar(id=${r.id})}">Editar</a>
                    <form method="post" th:action="@{/empleados/{id}/estado(id=${r.id})}">
        <input type="hidden" name="_envio" th:value="${envio}">
                        <button th:unless="${r.activo}" class="boton secundaria" type="submit" name="activo" value="true">Activar</button>
                        <details th:if="${r.activo}" class="confirmacion">
                            <summary class="boton secundaria">Desactivar…</summary>
                            <p>¿Confirmas que deseas desactivar este registro? Puedes cerrar este aviso para cancelar.</p>
                            <button class="boton peligro" type="submit" name="activo" value="false">Confirmar desactivación</button>
                        </details>
                    </form>
                </td>
            </tr></tbody>
        </table>
    </div>
    <nav aria-label="Paginación">
        <a th:if="${pagina > 0}" th:href="@{/empleados(pagina=${pagina - 1})}">Anterior</a>
        <a th:if="${registros.size() == 25}" th:href="@{/empleados(pagina=${pagina + 1})}">Siguiente</a>
    </nav>
</main>
</body>
</html>
