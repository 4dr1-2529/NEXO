<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{publico/base :: cabecera('Ingresar')}"></head>
<body>
<header th:replace="~{publico/base :: barra}"></header>
<main class="panel">
    <h1>Iniciar sesión</h1>
    <p class="error" role="alert" th:if="${param.error}">No fue posible iniciar sesión. Revisa tus credenciales.</p>
    <p role="status" th:if="${param.salida}">Sesión cerrada.</p>
    <form method="post" th:action="@{/login}">
        <label for="username">Usuario</label>
        <input id="username" name="username" maxlength="30" autocomplete="username" required>
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="boton" type="submit">Ingresar</button>
    </form>
</main>
</body>
</html>
