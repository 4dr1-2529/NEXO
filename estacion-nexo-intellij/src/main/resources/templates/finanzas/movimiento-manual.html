<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{publico/base :: cabecera('Movimiento manual')}"></head>
<body>
<header th:replace="~{navegacion :: menu}"></header>
<main class="resumen">
    <h1>Ingreso o egreso manual</h1>
    <p>Requiere caja abierta. No modifica inventario. Use conceptos distintos de COMPRA y VENTA.</p>
    <p class="error" role="alert" th:if="${error}" th:text="${error}"></p>
    <p th:if="${conceptos.isEmpty()}">No hay conceptos manuales activos. Cree uno en Conceptos económicos.</p>
    <form th:unless="${conceptos.isEmpty()}" method="post" th:action="@{/finanzas/movimiento-manual}">
        <input type="hidden" name="_envio" th:value="${envio}">
        <input type="hidden" name="solicitud" th:value="${solicitud}">
        <label for="concepto">Concepto</label>
        <select id="concepto" name="concepto" required>
            <option value="">Selecciona un concepto</option>
            <option th:each="c : ${conceptos}" th:value="${c.id}"
                    th:text="|${c.datos.codigo} · ${c.datos.nombre} (${c.datos.tipo})|"></option>
        </select>
        <label for="monto">Monto (S/)</label>
        <input type="number" id="monto" name="monto" min="0.01" step="0.01" required>
        <label for="descripcion">Descripción</label>
        <input id="descripcion" name="descripcion" maxlength="200" required>
        <button class="boton" type="submit">Registrar</button>
        <a class="boton secundaria" th:href="@{/finanzas}">Volver a caja</a>
    </form>
</main>
</body>
</html>
