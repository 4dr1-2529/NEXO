<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{publico/base :: cabecera('Proveedores')}"></head>
<body>
<header th:replace="~{navegacion :: menu}"></header>
<main class="resumen">
    <h1 th:text="${id == null ? 'Nuevo proveedor' : 'Editar registro'}"></h1>
    <p class="error" role="alert" th:if="${error}" th:text="${error}"></p>
    <form method="post" th:action="${id == null} ? @{/proveedores} : @{/proveedores/{id}/editar(id=${id})}" th:object="${datos}">
        <input type="hidden" name="_envio" th:value="${envio}">
        <label for="ruc">RUC</label>
        <input type="text" th:field="*{ruc}" inputmode="numeric" pattern="[0-9]{11}" maxlength="11" title="11 dígitos" required>
        <p class="error" th:if="${#fields.hasErrors('ruc')}" th:errors="*{ruc}"></p>
        <label for="razonSocial">Razón social</label>
        <input type="text" th:field="*{razonSocial}" required>
        <p class="error" th:if="${#fields.hasErrors('razonSocial')}" th:errors="*{razonSocial}"></p>
        <label for="contacto">Contacto</label>
        <input type="text" th:field="*{contacto}">
        <p class="error" th:if="${#fields.hasErrors('contacto')}" th:errors="*{contacto}"></p>
        <label for="telefono">Teléfono</label>
        <input type="tel" th:field="*{telefono}" inputmode="numeric" pattern="[0-9]{9}" maxlength="9" title="9 dígitos">
        <p class="error" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></p>
        <label for="correo">Correo</label>
        <input type="email" th:field="*{correo}">
        <p class="error" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></p>
        <label for="direccion">Dirección</label>
        <input type="text" th:field="*{direccion}">
        <p class="error" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}"></p>
        <button class="boton" type="submit">Guardar</button>
        <a class="boton secundaria" th:href="@{/proveedores}">Volver</a>
    </form>
</main>
</body>
</html>
